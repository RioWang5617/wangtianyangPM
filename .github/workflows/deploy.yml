name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_OPENCODE_KEY: ${{ secrets.VITE_OPENCODE_KEY }}
          VITE_VOLC1_KEY: ${{ secrets.VITE_VOLC1_KEY }}
          VITE_VOLC2_KEY: ${{ secrets.VITE_VOLC2_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=wangtianyang-pm --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9330bce223e000fb2335def862aa63d

      - name: Deployment URL
        run: echo "Deployed successfully"
